# Test configuration - uses Testcontainers MySQL and WireMock
# These values are overridden at runtime by BaseIntegrationTest

# Spring Boot will use the datasource URL injected by Testcontainers
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Hibernate crea el esquema a partir de las entidades y, a continuacion,
# se cargan los datos semilla. Requiere defer-datasource-initialization=true,
# declarado en application.yml.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-test.sql
spring.sql.init.data-locations=classpath:db/data-test.sql
spring.sql.init.continue-on-error=false

# WireMock base URL - overridden at runtime by BaseIntegrationTest
matricula.financiera.base-url=http://localhost:8089
matricula.financiera.connect-timeout-ms=5000
matricula.financiera.read-timeout-ms=10000

# Disable DevTools restart in tests
spring.devtools.restart.enabled=false

# La sincronizacion programada de pagos no debe ejecutarse durante las pruebas
spring.task.scheduling.pool.size=1

logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN

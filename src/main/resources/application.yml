spring:
  application:
    name: informacion_presupuestaria
  profiles:
    active: dev
  messages:
    basename: ValidationMessages
    encoding: UTF-8
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      continue-on-error: true
  devtools:
    restart:
      log-condition-evaluation-delta: false

server:
  port: 8094

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Documentacion OpenAPI generada por springdoc a partir del codigo.
#   Especificacion : http://localhost:8094/v3/api-docs
#   Swagger UI     : http://localhost:8094/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json

matricula:
  financiera:
    base-url: http://localhost:8092
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
